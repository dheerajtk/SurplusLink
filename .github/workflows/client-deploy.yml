name: Deploy Client to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'client/**'      # only triggers when client/ files change
      - '.github/workflows/client-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package.json

      - name: Install dependencies
        run: npm install
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Vercel auto-deploys on push via its GitHub integration (no extra step needed).
      # This job validates the build succeeds BEFORE Vercel deploys.
      # If the build fails here, the Vercel deploy is already cancelled.
      - name: Build succeeded
        run: echo "✅ Client build passed. Vercel will deploy automatically."
