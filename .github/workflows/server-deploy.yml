name: Deploy Server to Render

on:
  push:
    branches: [main]
    paths:
      - 'server/**'      # only triggers when server/ files change
      - '.github/workflows/server-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Install & lint check
        run: npm install
        working-directory: server

      # Trigger Render deploy hook (URL stored as GitHub Secret)
      # To get this URL: Render → your service → Settings → Deploy Hook → Copy
      - name: Trigger Render Deploy
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "✅ Render deploy triggered."
